<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="'Fira Code','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="0.5" stop-color="#1a1b3a"/><stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.85"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbit" d="M250,210 m-150,0 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/>
  </defs>

  <rect width="920" height="420" rx="20" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 70H920M0 140H920M0 210H920M0 280H920M0 350H920"/>
    <path d="M70 0V420M140 0V420M210 0V420M280 0V420M350 0V420M420 0V420M490 0V420M560 0V420M630 0V420M700 0V420M770 0V420M840 0V420"/>
  </g>

  <text x="28" y="38" fill="#94a3b8" font-size="12">swarm-anything · agent team topology</text>
  <text x="892" y="38" text-anchor="end" fill="#64748b" font-size="11">concept · 概念图</text>

  <!-- hub core -->
  <circle cx="250" cy="210" r="72" fill="url(#core)">
    <animate attributeName="r" values="62;80;62" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <text x="250" y="204" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">SWARM</text>
  <text x="250" y="226" text-anchor="middle" fill="#c4b5fd" font-size="11">AGENT TEAM</text>

  <!-- orbit ring -->
  <circle cx="250" cy="210" r="150" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="5 9" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate" from="0 250 210" to="360 250 210" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="210" r="108" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="250" cy="210" r="186" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.12"/>

  <!-- travelling tokens on orbit -->
  <g filter="url(#glow)">
    <circle r="6" fill="#22d3ee"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <circle r="3.5" fill="#a855f7" opacity="0.85"><animateMotion dur="7s" begin="-0.3s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <circle r="2.5" fill="#6366f1" opacity="0.7"><animateMotion dur="7s" begin="-0.6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
  </g>

  <!-- connectors -->
  <g stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 5">
    <path d="M250 138V76"/>
    <path d="M322 210H346"/>
    <path d="M250 282V343"/>
    <path d="M154 210H100"/>
  </g>

  <!-- nodes -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <g>
      <rect x="196" y="42" width="108" height="34" rx="17" fill="#1e1b4b" stroke="#818cf8"/>
      <text x="250" y="64" fill="#e0e7ff">🧠 Planner</text>
    </g>
    <g>
      <rect x="346" y="193" width="108" height="34" rx="17" fill="#164e63" stroke="#22d3ee"/>
      <text x="400" y="215" fill="#cffafe">🛠 Worker A</text>
    </g>
    <g>
      <rect x="196" y="343" width="108" height="34" rx="17" fill="#3b0764" stroke="#c084fc"/>
      <text x="250" y="365" fill="#f3e8ff">🔍 Reviewer</text>
    </g>
    <g>
      <rect x="46" y="193" width="108" height="34" rx="17" fill="#312e81" stroke="#a5b4fc"/>
      <text x="100" y="215" fill="#e0e7ff">🛠 Worker B</text>
    </g>
  </g>

  <!-- right panel -->
  <g>
    <rect x="580" y="56" width="312" height="320" rx="14" fill="#0b1020" fill-opacity="0.8" stroke="#6366f1" stroke-opacity="0.55"/>
    <circle cx="602" cy="78" r="5" fill="#f87171"/><circle cx="618" cy="78" r="5" fill="#fbbf24"/><circle cx="634" cy="78" r="5" fill="#34d399"/>
    <text x="874" y="82" text-anchor="end" fill="#94a3b8" font-size="11">swarm / team.ts</text>

    <g font-size="12.5" fill="#cbd5e1">
      <text x="602" y="116"><tspan fill="#c084fc">roles</tspan>    planner · worker · reviewer</text>
      <text x="602" y="144"><tspan fill="#c084fc">handoff</tspan>  task + context + artifact</text>
      <text x="602" y="172"><tspan fill="#c084fc">state</tspan>    SQLite · task DAG</text>
      <text x="602" y="200"><tspan fill="#c084fc">tools</tspan>    MCP · CLI · official SDKs</text>
      <text x="602" y="228"><tspan fill="#c084fc">gate</tspan>     human approval for risky writes</text>
      <text x="602" y="256"><tspan fill="#c084fc">loop</tspan>     dispatch → run → collect → review</text>
      <text x="602" y="284"><tspan fill="#22d3ee">while</tspan> (!done) {</text>
      <text x="618" y="310">await <tspan fill="#34d399">worker.step</tspan>()</text>
      <text x="602" y="336">}<tspan fill="#a855f7">▍<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
      <text x="602" y="362" fill="#fbbf24">status: SWA v1 · in development</text>
    </g>
  </g>

  <text x="250" y="404" text-anchor="middle" fill="#64748b" font-size="11">Anything Universe · Tools for agents. Room for anything.</text>
</svg>
